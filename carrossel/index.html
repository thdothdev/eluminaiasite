            document.getElementById('contador').textContent = `${nome} · ${SLIDES.length} slides · 1080×1350`;
            document.getElementById('voltar').hidden = false;
            document.getElementById('baixarPng').hidden = false;
            document.getElementById('exportarPdf').hidden = false;
            document.getElementById('diagnostico').hidden = false;
            document.getElementById('copiarPendentes').hidden = true;
        }

        /* ══════════ FILA DE PEDIDOS ══════════
           A página não tem servidor e não conversa com o Claude — ele só roda
           quando você manda mensagem. Então a fila serve para ANOTAR: os temas
           ficam salvos no navegador e, quando você pedir "faz os pendentes",
           ele lê tudo daqui de uma vez. Evita ter que lembrar e redigitar. */
        const CHAVE = 'elumina-pedidos';

        const lerPedidos = () => {
            try { return JSON.parse(localStorage.getItem(CHAVE)) || []; }
            catch (e) { return []; }
        };

        const salvarPedidos = lista => localStorage.setItem(CHAVE, JSON.stringify(lista));

        function adicionarPedido(tema, slides, obs) {
            const lista = lerPedidos();
            lista.push({ tema, slides: Number(slides) || 8, obs: obs || '', criadoEm: new Date().toISOString().slice(0, 10) });
            salvarPedidos(lista);
            renderizarGaleria();
        }

        function removerPedido(i) {
            const lista = lerPedidos();
            lista.splice(i, 1);
            salvarPedidos(lista);
            renderizarGaleria();
        }

        function textoDoPedido(p) {
            return `Novo carrossel — tema: ${p.tema}. ${p.slides} slides.` + (p.obs ? ` Observações: ${p.obs}` : '');
        }

        async function copiarPendentes() {
            const lista = lerPedidos();
            if (!lista.length) return;
            const txt = lista.length === 1 ? textoDoPedido(lista[0])
                : 'Cria estes carrosséis:\n' + lista.map((p, i) => `${i + 1}. ${textoDoPedido(p)}`).join('\n');
            try { await navigator.clipboard.writeText(txt); avisar('✓ copiado — cole na conversa'); }
            catch (e) { avisar('não consegui copiar; o texto está no console'); console.log(txt); }
        }

        function abrirFormulario() {
            const alvo = document.getElementById('slotNovo');
            alvo.outerHTML = `
                <form class="formulario" id="slotNovo" onsubmit="return false">
                    <label>Tema do carrossel
                        <input id="fTema" placeholder="ex: renovação que escapa" autofocus>
                    </label>
                    <label>Quantos slides
                        <input id="fSlides" type="number" min="4" max="20" value="8">
                    </label>
                    <label>Observações (opcional)
                        <textarea id="fObs" placeholder="ângulo, o que não pode faltar…"></textarea>
                    </label>
                    <div class="linha">
                        <button class="principal" id="fGerar">Gerar agora</button>
                        <button id="fSalvar">Só anotar</button>
                        <button id="fCancelar">Cancelar</button>
                    </div>
                    <p class="aviso-servidor" id="avisoServidor" hidden></p>
                </form>`;
            document.getElementById('fSalvar').onclick = () => {
                const t = document.getElementById('fTema').value.trim();
                if (!t) return document.getElementById('fTema').focus();
                adicionarPedido(t, document.getElementById('fSlides').value, document.getElementById('fObs').value.trim());
            };
            document.getElementById('fGerar').onclick = gerarAgora;
            document.getElementById('fCancelar').onclick = renderizarGaleria;
            document.getElementById('fTema').focus();
            /* o botão só promete o que o servidor pode cumprir */
            fetch('/api/status').catch(() => {
                const b = document.getElementById('fGerar');
                b.disabled = true;
                b.style.opacity = '.45';
                const av = document.getElementById('avisoServidor');
                av.hidden = false;
                av.textContent = 'Para gerar direto daqui, rode  node servidor.js  na pasta do carrossel e abra pela porta 4319. Sem ele, dá para anotar e pedir na conversa.';
            });
        }

        /* Dispara a geração no servidor e acompanha até terminar. O trabalho
           pesado é do Claude rodando em `claude -p` do outro lado; aqui só
           mostramos o andamento e recarregamos quando o deck entrar no
           arquivo. */
        async function gerarAgora() {
            const tema = document.getElementById('fTema').value.trim();
            if (!tema) return document.getElementById('fTema').focus();
            const pedido = {
                tema,
                slides: document.getElementById('fSlides').value,
                obs: document.getElementById('fObs').value.trim()
            };

            const alvo = document.getElementById('slotNovo');
            alvo.outerHTML = `<div class="formulario" id="slotNovo">
                <b style="color:#eef2fa;font-size:15px">Gerando “${tema}”…</b>
                <p style="margin:0;color:#8896ae;font-size:13px" id="andamento">enviando o pedido…</p>
                <p style="margin:0;color:#66748f;font-size:12px">Costuma levar de um a três minutos. Pode deixar a aba aberta.</p>
            </div>`;
            const passo = t => { const e = document.getElementById('andamento'); if (e) e.textContent = t; };

            let r;
            try {
                r = await fetch('/api/gerar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                });
            } catch (e) {
                passo('não achei o servidor. Rode  node servidor.js  e abra pela porta 4319.');
                return;
            }
            if (!r.ok) { passo('recusado: ' + ((await r.json().catch(() => ({}))).erro || r.status)); return; }

            passo('o Claude está escrevendo o deck…');
            const inicio = Date.now();
            while (Date.now() - inicio < 10 * 60 * 1000) {
                await new Promise(r => setTimeout(r, 2500));
                const st = await fetch('/api/status').then(x => x.json()).catch(() => null);
                if (!st) continue;
                if (st.estado === 'livre' || st.estado === 'pronto') {
                    passo('pronto — recarregando…');
                    return setTimeout(() => location.reload(), 700);
                }
                if (st.estado === 'falhou') { passo('falhou. Veja o terminal do servidor.'); return; }
                passo(`o Claude está escrevendo o deck… (${Math.round((Date.now() - inicio) / 1000)}s)`);
            }
            passo('demorou demais. Veja o terminal do servidor.');
        }

        function renderizarGaleria() {
            DECK_ATUAL = null;
            document.getElementById('voltar').hidden = true;
            document.getElementById('baixarPng').hidden = true;
            document.getElementById('exportarPdf').hidden = true;
            document.getElementById('diagnostico').hidden = true;
            document.getElementById('contador').textContent =
                `${Object.keys(DECKS).length} carrosséis`;

            saida.className = 'galeria';
            saida.insertAdjacentHTML('beforebegin', document.getElementById('cabecalhoGaleria')
                ? '' : `<div class="titulo-galeria" id="cabecalhoGaleria">Carrosséis Elumina
                    <small>Clique para abrir, revisar e baixar os PNGs em 1080×1350.</small></div>`);
            const pedidos = lerPedidos();
            const escapar = t => t.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

            saida.innerHTML = Object.entries(DECKS).map(([nome, slides]) => {
                VIS = { ...VISUAL, ...(VISUAL_POR_DECK[nome] || {}) };
                return `
                <a class="cartao-deck" href="?deck=${nome}">
                    <div class="vitrine"><div class="escala">${htmlDoSlide(slides[0], 0, slides.length)}</div></div>
                    <div class="ficha">
                        <b>${nomeDoDeck(slides)}</b>
                        <span>${nome} · ${slides.length} slides</span>
                    </div>
                </a>`; }).join('')
                + pedidos.map((p, i) => `
                <div class="cartao-pedido">
                    <span class="marca-pendente">pedido · ${p.criadoEm}</span>
                    <b>${escapar(p.tema)}</b>
                    <p>${p.slides} slides${p.obs ? ' · ' + escapar(p.obs) : ''}</p>
                    <div class="acoes-pedido">
                        <button onclick="copiarUm(${i})">Copiar</button>
                        <button onclick="removerPedido(${i})">Remover</button>
                    </div>
                </div>`).join('')
                + `<button class="cartao-novo" id="slotNovo" onclick="abrirFormulario()">
                        <b>+ Novo tema</b>
                        <span>anota aqui e peça &ldquo;faz os pendentes&rdquo; na conversa</span>
                   </button>`;

            const btn = document.getElementById('copiarPendentes');
            btn.hidden = !pedidos.length;
            btn.textContent = `Copiar ${pedidos.length} pendente${pedidos.length > 1 ? 's' : ''}`;

            /* a miniatura é o slide real encolhido; a escala depende da largura
               do cartão, que só existe depois do layout */
            saida.querySelectorAll('.vitrine').forEach(v => {
                v.querySelector('.escala').style.transform = `scale(${v.clientWidth / 1080})`;
            });
        }

        let DECK_ATUAL = null;
        const pedido = new URLSearchParams(location.search).get('deck');
        if (pedido && DECKS[pedido]) renderizarDeck(pedido);
        else renderizarGaleria();

        /* ── posicionamento dos traços à mão ──────────────────────────────
           Por que em JS: o traço tem que abraçar a MANCHA da palavra, e a
           mancha depende da baseline e das métricas do glifo. Em CSS só dá
           pra mirar na caixa de linha, que muda de altura conforme o
           line-height de cada estilo (1.04 no título, 1.5 no apoio) — foi o
           que jogou o círculo uma linha acima da palavra.
           Aqui a baseline vem de uma âncora de altura zero e a mancha vem do
           measureText do canvas. Roda depois das fontes carregarem, senão as
           métricas medidas são as da fonte de fallback. */
        const medidor = document.createElement('canvas').getContext('2d');

        /* y da baseline: âncora de altura zero alinhada por vertical-align */
        function baselineDe(el) {
            const a = document.createElement('i');
            a.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
            el.appendChild(a);
            const y = a.getBoundingClientRect().bottom;
            a.remove();
            return y;
        }

        /* topo e base da tinta real do texto (não da caixa de linha) */
        function mancha(el) {
            const cs = getComputedStyle(el);
            medidor.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
            const m = medidor.measureText(el.textContent);
            const b = baselineDe(el);
            return { topo: b - m.actualBoundingBoxAscent, base: b + m.actualBoundingBoxDescent };
        }

        function posicionarDesenhos() {
            document.querySelectorAll('.circulado, .rabisco').forEach(el => {
                const svg = el.querySelector('svg');
                if (!svg) return;

                const tinta = mancha(el);
                const corpo = parseFloat(getComputedStyle(el).fontSize);
                const topoCaixa = el.getBoundingClientRect().top;

                let altura;
                if (el.classList.contains('circulado')) {
                    const folga = corpo * 0.17;          // respiro do traço em volta
                    svg.style.top = (tinta.topo - topoCaixa - folga) + 'px';
                    altura = tinta.base - tinta.topo + folga * 2;
                } else {
                    /* A caixa começa no topo da tinta (é o que faz o desenho
                       sobreviver à exportação) e o traço mora a RABISCO_Y dela.
                       A altura sai de onde o traço precisa cair: um pouco
                       abaixo da palavra, sem entrar na linha de baixo.
                       Antes era um valor arbitrário e o traço invadia 15px. */
                    svg.style.top = (tinta.topo - topoCaixa) + 'px';
                    const quedaDesejada = (tinta.base - tinta.topo) + corpo * 0.09;
                    altura = quedaDesejada / RABISCO_Y;
                }
                svg.style.height = altura + 'px';

                /* Largura e altura como ATRIBUTO, não só via CSS. Na exportação o
                   html2canvas serializa cada <svg> isolado; sem dimensão
                   intrínseca ele fica sem tamanho e é descartado — era por isso
                   que o rabisco e o círculo sumiam do PNG. */
                const largura = el.offsetWidth + 4;      // os -2px de cada lado
                svg.style.left = '-2px';
                svg.style.right = 'auto';
                svg.style.width = largura + 'px';
                svg.setAttribute('width', Math.round(largura));
                svg.setAttribute('height', Math.round(altura));
            });
        }

        /* ══════════ AUTOVERIFICAÇÃO ══════════
           Roda a cada carga, depois das fontes e do posicionamento dos traços.
           Existe porque a saída é IMAGEM: o que estiver fora do lugar não dá
           erro nenhum, só vira PNG torto — e aí já foi pro feed.
           As marcas de erro vivem só em @media screen, então não entram no PDF. */
        const ALTURA_SLIDE = 1350;

        function auditar() {
            const r = e => e.getBoundingClientRect();
            const achados = [];
            const slides = [...document.querySelectorAll('.slide')];
            const anota = (slide, tipo, detalhe, el) => achados.push({ slide, tipo, detalhe, el });

            if (slides.length > 20) {
                anota('—', 'carrossel longo demais', `${slides.length} slides; o Instagram aceita 20`, null);
            }

            /* Nome errado de símbolo ou ícone devolve string vazia e o desenho
               simplesmente não aparece — sem erro no console. Confere contra o
               que os SLIDES pediram, não contra o que renderizou. */
            (DECKS[DECK_ATUAL] || []).forEach((s, i) => {
                if (s.simbolo && !SIMBOLOS[s.simbolo]) {
                    anota(i + 1, 'símbolo inexistente', `"${s.simbolo}" — use: ${Object.keys(SIMBOLOS).join(', ')}`, null);
                }
                const comIcone = [...(s.icones || []), ...(s.etapas || []), ...(s.pilha || []), ...(s.checks || []),
                                  ...((s.radial && s.radial.satelites) || [])];
                comIcone.forEach(x => {
                    if (x && x.icone && !ICONES[x.icone]) {
                        anota(i + 1, 'ícone inexistente', `"${x.icone}" em "${x.titulo || x.texto || ''}"`, null);
                    }
                });
            });

            slides.forEach((s, i) => {
                const n = i + 1;
                const cx = r(s);

                if (Math.round(cx.height) !== ALTURA_SLIDE) {
                    anota(n, 'altura fora do formato', `${Math.round(cx.height)}px em vez de ${ALTURA_SLIDE}`, s);
                }

                /* 1. peça escapando da borda — sai cortada na exportação */
                s.querySelectorAll('*').forEach(el => {
                    if (el.closest('svg') && el.tagName !== 'svg') return;
                    const b = r(el);
                    if (!b.width || !b.height) return;
                    const fora = [];
                    if (b.left < cx.left - 1) fora.push(`${Math.round(cx.left - b.left)}px à esquerda`);
                    if (b.right > cx.right + 1) fora.push(`${Math.round(b.right - cx.right)}px à direita`);
                    if (b.top < cx.top - 1) fora.push(`${Math.round(cx.top - b.top)}px acima`);
                    if (b.bottom > cx.bottom + 1) fora.push(`${Math.round(b.bottom - cx.bottom)}px abaixo`);
                    if (fora.length) anota(n, 'escapa do slide', `${el.className || el.tagName}: ${fora.join(', ')}`, el);
                });

                /* 2. texto maior que a caixa: some sem avisar */
                s.querySelectorAll('h2, p, b, span, div, li').forEach(el => {
                    if (el.children.length || !el.clientWidth) return;
                    if (el.scrollWidth > el.clientWidth + 1) {
                        anota(n, 'texto cortado', `"${el.textContent.trim().slice(0, 34)}"`, el);
                    }
                });

                /* 3. corpo maior que o espaço entre moldura e rodapé */
                const corpo = s.querySelector('.corpo');
                if (corpo.scrollHeight > corpo.clientHeight + 1) {
                    anota(n, 'conteúdo não cabe', `sobra ${corpo.scrollHeight - corpo.clientHeight}px — tire texto ou um bloco`, corpo);
                }

                /* 4. blocos irmãos se sobrepondo — nos DOIS eixos.
                      Checar só o vertical dava falso positivo com peça posta no
                      canto: ela divide a altura com o título mas fica ao lado.
                      O miolo é um invólucro: o que interessa são os filhos dele. */
                const miolo = corpo.querySelector('.miolo');
                const blocos = [...corpo.children, ...(miolo ? miolo.children : [])]
                    .filter(e => e !== miolo && r(e).height > 0);
                for (let a = 0; a < blocos.length; a++) {
                    for (let b = a + 1; b < blocos.length; b++) {
                        const x = r(blocos[a]), y = r(blocos[b]);
                        const cruzaY = x.top < y.bottom - 2 && y.top < x.bottom - 2;
                        const cruzaX = x.left < y.right - 2 && y.left < x.right - 2;
                        if (cruzaY && cruzaX) {
                            anota(n, 'blocos sobrepostos', `${blocos[a].className} × ${blocos[b].className}`, blocos[b]);
                        }
                    }
                }

                /* 4b. peça absoluta quase toda fora do pai. Na exportação o
                      html2canvas recorta o que passa da caixa do pai, então ela
                      sai cortada ou some — foi assim que o rabisco e a seta da
                      nota sumiram do PNG. */
                /* offsetParent NÃO existe em elemento SVG — usar isso deixava a
                   checagem inerte justo nos casos que ela existe para pegar. */
                const paiPosicionado = el => {
                    let p = el.parentElement;
                    while (p && getComputedStyle(p).position === 'static') p = p.parentElement;
                    return p;
                };
                s.querySelectorAll('.simbolo.canto, .circulado svg, .rabisco svg, .selo-canto').forEach(el => {
                    const pai = paiPosicionado(el);
                    if (!pai) return;
                    const b = r(el), p = r(pai);
                    const largura = Math.min(b.right, p.right) - Math.max(b.left, p.left);
                    const altura = Math.min(b.bottom, p.bottom) - Math.max(b.top, p.top);
                    const dentro = Math.max(0, largura) * Math.max(0, altura) / (b.width * b.height);
                    if (dentro < 0.25) {
                        anota(n, 'peça fora do pai (some no PNG)',
                            `${el.className || el.tagName}: só ${Math.round(dentro * 100)}% dentro de ${pai.className.split(' ')[0]}`, el);
                    }
                });

                /* 5. decoração por cima de texto. O selo cruza a moldura de
                      propósito, então só texto conta como colisão. */
                const cruza = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
                s.querySelectorAll('.selo-canto, .nota .seta, .simbolo.canto').forEach(dec => {
                    const db = r(dec);
                    s.querySelectorAll('.corpo h2, .corpo p, .corpo b, .corpo li').forEach(t => {
                        if (t.closest('.nota')) return;
                        if (cruza(db, r(t))) {
                            anota(n, 'decoração sobre texto', `${dec.className || dec.tagName} × "${t.textContent.trim().slice(0, 26)}"`, dec);
                        }
                    });
                });

                /* 5b. marcação que não virou nada. Sintaxe errada no texto sai
                      literal na imagem — o `**` apareceu num slide exatamente
                      assim, com selo verde. */
                s.querySelectorAll('.corpo p, .corpo h2, .corpo li, .corpo b, .corpo span').forEach(el => {
                    if (el.children.length) return;
                    const sobrou = (el.textContent.match(/\*\*|__|\{|\}|\(\(|\)\)/g) || [])[0];
                    if (sobrou) anota(n, 'marcação não convertida', `"${sobrou}" em "${el.textContent.trim().slice(0, 34)}"`, el);
                });

                /* 6. sobra órfã: última linha curtíssima (o "?" sozinho) */
                s.querySelectorAll('h2, p, .fecho, .etapas b, .quadrante b').forEach(el => {
                    if (!el.clientWidth) return;
                    const rg = document.createRange();
                    rg.selectNodeContents(el);
                    const linhas = [...rg.getClientRects()].filter(x => x.height > 15);
                    if (linhas.length < 2) return;
                    const ultima = linhas.reduce((m, x) => x.top > m.top ? x : m, linhas[0]);
                    if (ultima.width < el.clientWidth * 0.12) {
                        anota(n, 'sobra órfã na última linha', `"${el.textContent.trim().slice(-26)}"`, el);
                    }
                });

                /* 7. traço à mão desalinhado — ou grande demais.
                      O defeito original era ALTURA: o círculo tinha 158% da
                      caixa de linha e invadia a linha de cima. Ficava quase
                      centrado, então checar só o centro não pegava. */
                s.querySelectorAll('.circulado').forEach(el => {
                    const svg = el.querySelector('svg');
                    if (!svg) return;
                    const t = mancha(el), b = r(svg), caixa = r(el);
                    const desvio = Math.round((b.top + b.bottom) / 2 - (t.topo + t.base) / 2);

                    if (Math.abs(desvio) > 4 || b.top > t.topo || b.bottom < t.base) {
                        anota(n, 'círculo fora da palavra', `"${el.textContent}" desviado ${desvio}px`, el);
                        return;
                    }

                    /* O círculo é sempre mais alto que a caixa de linha — é um
                       traço à mão, transbordar pra espaço vazio é o normal. Só
                       vira defeito quando encosta em TINTA vizinha. Medir contra
                       a caixa de linha dava falso positivo. */
                    const banda = c => ({ top: c.top + c.height * 0.16, bottom: c.bottom - c.height * 0.2, left: c.left, right: c.right });
                    const encosta = c => b.left < c.right && c.left < b.right && b.top < c.bottom - 3 && c.top < b.bottom - 3;

                    const bloco = el.closest('h2, p, div');
                    const rg = document.createRange();
                    rg.selectNodeContents(bloco);
                    const outrasLinhas = [...rg.getClientRects()].filter(l =>
                        l.height > 15 && l.width > 4 &&
                        Math.abs((l.top + l.bottom) / 2 - (caixa.top + caixa.bottom) / 2) > 20);

                    const vizinhos = [...corpo.children].filter(x => x !== bloco && !x.contains(el));

                    if (outrasLinhas.some(l => encosta(banda(l)))) {
                        anota(n, 'círculo encostando na linha vizinha', `"${el.textContent}"`, el);
                    } else if (vizinhos.some(v => encosta(banda(r(v))))) {
                        anota(n, 'círculo encostando no bloco vizinho', `"${el.textContent}"`, el);
                    }
                });
                /* Compara a altura do TRAÇO, não do topo da caixa: a caixa cobre a
                   palavra de propósito (é o que faz o desenho sobreviver à
                   exportação) e o traço mora no rodapé dela. */
                s.querySelectorAll('.rabisco').forEach(el => {
                    const svg = el.querySelector('svg');
                    if (!svg) return;
                    const t = mancha(el), b = r(svg);
                    const yTraco = b.top + b.height * RABISCO_Y;
                    if (yTraco < t.base - 2) anota(n, 'rabisco em cima do texto', `"${el.textContent}"`, el);
                });
            });

            return achados;
        }

        function mostrarDiagnostico() {
            document.querySelectorAll('.tem-erro').forEach(e => e.classList.remove('tem-erro'));
            const achados = auditar();
            const caixa = document.getElementById('diagnostico');
            if (!caixa) return;

            if (!achados.length) {
                caixa.className = 'ok';
                caixa.textContent = `✓ ${document.querySelectorAll('.slide').length} slides, tudo no lugar`;
                console.log('%c✓ carrossel sem erros de layout', 'color:#22c55e;font-weight:600');
                return;
            }

            achados.forEach(a => a.el && a.el.classList.add('tem-erro'));
            caixa.className = 'ruim';
            caixa.textContent = `⚠ ${achados.length} ${achados.length === 1 ? 'problema' : 'problemas'} — ver console`;
            caixa.onclick = () => {
                const primeiro = achados.find(a => a.el);
                if (primeiro) primeiro.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
            };
            console.group('%c⚠ problemas de layout no carrossel', 'color:#ef4444;font-weight:600');
            console.table(achados.map(({ slide, tipo, detalhe }) => ({ slide, tipo, detalhe })));
            console.groupEnd();
        }

        /* `currentColor` não sobrevive à exportação: o html2canvas serializa cada
           <svg> sozinho, o CSS não acompanha, e a cor cai para o preto inicial —
           símbolo branco em slide escuro simplesmente sumia do PNG.
           Aqui o navegador resolve a cor de cada SVG no contexto real e o valor
           é gravado como atributo. Vale para qualquer contexto, inclusive os que
           ainda não existem (ícone branco em cartão cobalto, e por aí). */
        function fixarCores() {
            document.querySelectorAll('.simbolo svg, svg.ic').forEach(svg => {
                const cor = getComputedStyle(svg).color;
                svg.style.color = cor;

                /* A camada de volume é uma sombra: no claro, tinta translúcida
                   funciona. No escuro nada é mais escuro que o fundo, e a mesma
                   regra pintava um borrão cinza claro atrás do desenho. Ali ela
                   vira eco em cobalto — lê como profundidade, não como sujeira. */
                const escuro = !!svg.closest('.slide.escuro');
                svg.querySelectorAll('[data-volume]').forEach(g => {
                    g.setAttribute('fill', escuro ? '#4f70ff' : cor);
                    g.setAttribute('opacity', escuro ? '0.3' : '0.13');
                });
                svg.querySelectorAll('[data-chao]').forEach(e => {
                    e.setAttribute('fill', cor);
                    e.setAttribute('opacity', escuro ? '0' : '0.12');
                });

                svg.querySelectorAll('[stroke="currentColor"]').forEach(e => e.setAttribute('stroke', cor));
                svg.querySelectorAll('[fill="currentColor"]').forEach(e => e.setAttribute('fill', cor));

                /* mesma rede do traço à mão: tamanho como atributo */
                const b = svg.getBoundingClientRect();
                if (b.width && b.height) {
                    svg.setAttribute('width', Math.round(b.width));
                    svg.setAttribute('height', Math.round(b.height));
                }
            });
        }

        function verificar() {
            posicionarDesenhos();
            fixarCores();
            if (DECK_ATUAL) mostrarDiagnostico();
        }

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(verificar);
        } else {
            window.addEventListener('load', verificar);
        }

        /* reflow por zoom/janela muda quebra de linha — reavalia */
        let repique;
        addEventListener('resize', () => { clearTimeout(repique); repique = setTimeout(verificar, 250); });

        /* ══════════ EXPORTAR PNG ══════════
           Sai 1080×1350 exato, que é o 4:5 do feed — nada de converter PDF.
           `scale: 1` é obrigatório: sem isso o html2canvas multiplica pelo
           devicePixelRatio e o arquivo sai com tamanho errado.
           A marca de erro do diagnóstico vive em @media screen, e o
           html2canvas renderiza estilos de tela — então ela sairia dentro do
           PNG. Por isso as classes são removidas durante a captura. */
        const LARGURA = 1080, ALTURA = 1350;

        function avisar(txt) { document.getElementById('progresso').textContent = txt; }

        function baixar(blob, nome) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nome;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
        }

        async function exportarPngs() {
            if (typeof html2canvas === 'undefined') {
                avisar('html2canvas não carregou — sem internet? Use Exportar PDF.');
                return;
            }

            const slides = [...document.querySelectorAll('.slide')];
            const marcados = [...document.querySelectorAll('.tem-erro')];
            const problemas = auditar().length;
            if (problemas && !confirm(`O diagnóstico acusa ${problemas} problema(s). Exportar mesmo assim?`)) return;

            marcados.forEach(e => e.classList.remove('tem-erro'));
            const botao = document.getElementById('baixarPng');
            botao.disabled = true;

            try {
                for (let i = 0; i < slides.length; i++) {
                    avisar(`gerando ${i + 1}/${slides.length}…`);
                    const canvas = await html2canvas(slides[i], {
                        width: LARGURA,
                        height: ALTURA,
                        scale: 1,
                        useCORS: true,
                        backgroundColor: null,
                        logging: false
                    });
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                    baixar(blob, `elumina-${DECK_ATUAL}-${String(i + 1).padStart(2, '0')}.png`);
                    // o Chrome engasga com downloads em rajada
                    await new Promise(r => setTimeout(r, 350));
                }
                avisar(`✓ ${slides.length} PNGs baixados`);
            } catch (e) {
                avisar('falhou: ' + e.message);
                console.error(e);
            } finally {
                marcados.forEach(e => e.classList.add('tem-erro'));
                botao.disabled = false;
            }
        }

        document.getElementById('baixarPng').addEventListener('click', exportarPngs);

    </script>
</body>

</html>
